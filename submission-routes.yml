# submission-routes.yml template â€” copy this file, fill in the blanks.
#
# route/method/controller are pre-filled and fixed (every student deploys the
# same given backend). For each entry, fill in:
#   apiGatewayRoute   the AWS route key you deployed it behind, e.g. "ANY /v1/posts/{proxy+}"
#   lambdaARN         which Lambda serves it
#   storage           the ONE primary DynamoDB table or S3 bucket it touches (entity + arn),
#                     or omit entirely if this route has no backing storage resource
#   additionalStorage optional â€” only if this route genuinely touches more than one
#                     resource (e.g. a cascading delete or a multi-table enrichment read)
#
# See cra.md's Submission Requirements section for the full field reference.

routing:
  - route: /v1/auth/register
    method: POST
    controller: auth
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: user, arn: "" }
    additionalStorage: []

  - route: /v1/auth/login
    method: POST
    controller: auth
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: user, arn: "" }
    additionalStorage: []

  - route: /v1/posts
    method: POST
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: post, arn: "" }
    additionalStorage: []

  - route: /v1/posts/user/{userId}
    method: GET
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: post, arn: "" }
    additionalStorage: []

  - route: /v1/posts/{id}
    method: GET
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: post, arn: "" }
    additionalStorage: []

  - route: /v1/posts/{id}
    method: PUT
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: post, arn: "" }
    additionalStorage: []

  - route: /v1/posts/{id}
    method: DELETE
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: post, arn: "" }
    additionalStorage: []

  - route: /v1/posts/{id}/like
    method: POST
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: like, arn: "" }
    additionalStorage: []

