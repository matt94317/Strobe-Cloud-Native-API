  - route: /v1/posts/{postId}/comments
    method: GET
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: comment, arn: "" }
    additionalStorage: []

  - route: /v1/posts/{postId}/comments/{commentId}
    method: DELETE
    controller: post
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: comment, arn: "" }
    additionalStorage: []

  - route: /v1/feed
    method: GET
    controller: feed
    apiGatewayRoute: ""
    lambdaARN: ""
    storage: { entity: post, arn: "" }
    additionalStorage: [] # e.g. user/follow/like/comment, if your feed enriches with them

  - route: /v1/users
